name: Run power outages schedule generator

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [check-schedule]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  monitor:
    name: monitor${{ matrix.target && format(' ({0})', matrix.target) || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(vars.TARGETS || '[""]') }}
    environment: ${{ matrix.target || null }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout artifacts
        run: |
          REMOTE_BRANCH=$(git ls-remote --heads origin artifacts)

          if [ -n "$REMOTE_BRANCH" ]; then
            git fetch --depth 1 origin artifacts
            git worktree add --detach artifacts FETCH_HEAD
          else
            git worktree add --orphan -b artifacts artifacts
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          echo "PLAYWRIGHT_VERSION=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-headless-shell

      - name: Install Chromium headless shell
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium

      - name: Run schedule generation script
        env:
          TARGET: ${{ matrix.target }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REGION: ${{ secrets.REGION }}
          GROUP: ${{ secrets.GROUP }}
        run: node ./src/schedule.js

      - name: Commit updated artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git -C artifacts add --all

          if git -C artifacts diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          if git -C artifacts rev-parse --verify --quiet HEAD; then
            git -C artifacts commit --amend --no-edit
          else
            git -C artifacts commit -m "chore: update artifacts"
          fi

          git push --force origin "$(git -C artifacts rev-parse HEAD):refs/heads/artifacts"

      - name: Keep workflow enabled
        if: always() && strategy.job-index == 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/schedule.yml/enable"
